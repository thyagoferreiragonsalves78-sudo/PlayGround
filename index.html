<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sonic: Corrida Tropical</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b39;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100svh;overflow:hidden}.shell{width:min(100vw,1120px);padding:14px}.game{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:3px solid #fff9;border-radius:20px;box-shadow:0 20px 70px #0009;background:#62d5f4}canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;inset:13px 16px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 6px #0038}.badge{background:#092a59d9;border:1px solid #ffffff55;border-radius:12px;padding:8px 13px;font-weight:900}.stats{display:flex;gap:8px}.hint{font-size:12px;margin-top:6px;opacity:.86}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#0619434d,#061943aa);text-align:center;padding:20px}.card{max-width:520px;padding:25px 32px;border-radius:24px;border:2px solid #ffffff66;background:#082a58e8;box-shadow:0 16px 48px #001c4d99}.eyebrow{font-size:12px;letter-spacing:.22em;color:#79f4ff;font-weight:900}.card h1{font-size:clamp(34px,7vw,68px);line-height:.95;margin:10px 0;color:#ffe45c;font-style:italic;text-shadow:0 5px 0 #f47724,0 8px 18px #001c4d}.card p{line-height:1.55;margin:13px 0 20px}.btn{border:0;border-radius:999px;background:linear-gradient(#ffec64,#ffad28);color:#542b00;font-weight:1000;font-size:16px;padding:13px 25px;box-shadow:0 5px 0 #be5d12;cursor:pointer}.mobile{display:none;position:absolute;inset:auto 16px 14px;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:flex;gap:10px}.touch{pointer-events:auto;border:1px solid #fff8;background:#082a58a8;color:white;border-radius:50%;width:58px;height:58px;font-size:23px;font-weight:bold;touch-action:none;user-select:none}.touch.jump{width:70px;height:70px;background:#f27d29c9}@media(max-width:700px){.shell{padding:0}.game{border:0;border-radius:0;height:100svh;aspect-ratio:auto}.top{inset:9px}.badge{padding:6px 9px;font-size:12px}.hint{display:none}.mobile{display:flex}.card{padding:20px 22px}.card p{font-size:14px}}
</style></head><body><main class="shell"><div class="game"><canvas id="game" width="960" height="540" aria-label="Jogo de plataforma Sonic"></canvas><div class="top"><div><div class="badge">🦔 SONIC · ILHA TROPICAL</div><div class="hint">← → / A D correr · Espaço / ↑ saltar · P pausar</div></div><div class="stats"><div class="badge">💍 <span id="rings">0</span></div><div class="badge">❤️ <span id="lives">3</span></div><div class="badge">⏱ <span id="timer">0:00</span></div></div></div><div id="overlay" class="overlay"><div class="card"><div class="eyebrow">AVENTURA DE PLATAFORMA</div><h1>SONIC<br>CORRIDA TROPICAL</h1><p>Corra pela ilha, pegue anéis dourados e desvie dos robôs do Dr. Eggman. Chegue à placa de chegada!</p><button id="start" class="btn">COMEÇAR A CORRIDA ▶</button></div></div><div class="mobile"><div class="pad"><button class="touch" data-key="left">◀</button><button class="touch" data-key="right">▶</button></div><button class="touch jump" data-key="jump">⬆</button></div></div></main><script src="game.js"></script></body></html>
